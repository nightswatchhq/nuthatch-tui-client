name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded PR run wastes a runner nobody reads the result of. Pushes to `main` are what the
  # next `git pull` waits on, so those are never cancelled.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same three steps as `yatr ci`, spelled out in cargo so the runner needs nothing installed
  # beyond a toolchain. `--locked` because Cargo.lock is committed: CI should fail on a stale lock
  # rather than quietly resolving a different dependency tree than the one anybody tested.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The README tells people which Rust they need, so something had better hold that sentence to
  # account. This is the only job allowed to fail for a reason that is not a bug in the code.
  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked
