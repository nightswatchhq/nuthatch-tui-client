name: release

# On a version tag: build a binary per target, attach each with its checksum and build provenance
# to a draft release, verify that provenance, then publish. The shape is nuthatch's own release.yml,
# less the container image a terminal client has no use for.
#
# A pull request that touches this file runs the build, smoke test and packaging and stops there,
# so the first time the matrix is exercised is not the first real tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write
  # Build provenance is a Sigstore bundle signed with a certificate from GitHub's OIDC provider, so
  # what it attests is this workflow run on this repository rather than a key somebody holds.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A draft before anything builds, so a failing leg leaves nothing public and nothing empty.
  release-notes:
    name: release notes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: resolve release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Write the release's notes there before tagging - see docs/releases/README.md."
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: create draft release with notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    name: ${{ matrix.target }}
    needs: release-notes
    # Runs after the draft on a tag, and on its own for a pull request, where release-notes skips.
    if: always() && needs.release-notes.result != 'failure' && needs.release-notes.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
          # 22.04 rather than ubuntu-latest: a binary needs the glibc it was built against or newer,
          # so the builder's glibc (2.35 here) is the floor for every machine that can run it.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke test
        run: target/${{ matrix.target }}/release/nuthatch-tui-client --version
      - name: package
        run: |
          tarball="nuthatch-tui-client-${{ matrix.target }}.tar.gz"
          tar czf "$tarball" -C "target/${{ matrix.target }}/release" nuthatch-tui-client
          shasum -a 256 "$tarball" > "$tarball.sha256"
          ls -lh "$tarball"
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nuthatch-tui-client-${{ matrix.target }}.tar.gz
            nuthatch-tui-client-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true
      - name: attest the built artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nuthatch-tui-client-${{ matrix.target }}.tar.gz

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # A checksum downloaded beside its tarball proves only that the download did not corrupt.
      # The provenance proves this workflow built it, so it is checked before anyone is offered it.
      - name: verify provenance before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --clobber
          shopt -s nullglob
          files=(*.tar.gz)
          if [ ${#files[@]} -ne 2 ]; then
            echo "::error::expected 2 tarballs on the release, found ${#files[@]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
      - name: undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }} --repo "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
